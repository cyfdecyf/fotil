{% if pics %}
<div id="photo-grid" class="grid grid-cols-3 md:grid-cols-4 xl:grid-cols-6 gap-3">
  {% for pic in pics %}
  <figure class="photo-card relative aspect-square overflow-hidden rounded-lg bg-neutral-200 cursor-pointer"
          data-pic-path="{{ pic.rel }}">
    <img class="w-full h-full object-cover" loading="lazy" alt="{{ pic.name }}"
         src="/image?library={{ library | urlencode }}&path={{ pic.rel | urlencode }}"
         onerror="fotilPicError(this)">
    <figcaption class="absolute inset-x-0 bottom-0 bg-black/40 text-white text-xs px-1 py-0.5 truncate">{{ pic.name }}</figcaption>
    <span class="pick-badge absolute top-1 right-1 w-6 h-6 rounded-full bg-red-600 text-white text-sm flex items-center justify-center">✓</span>
  </figure>
  {% endfor %}
</div>
{% if has_more %}
<div class="mt-4 text-center">
  <button class="text-sm border border-neutral-300 bg-white rounded px-4 py-2 hover:bg-neutral-100"
          hx-get="/grid?library={{ library | urlencode }}&dir={{ dir | urlencode }}&offset={{ offset + page_size }}"
          hx-target="this" hx-swap="outerHTML">
    加载更多 (剩余 {{ remaining }})
  </button>
</div>
{% endif %}
{% elif offset == 0 %}
<p class="text-neutral-500">此目录没有照片。</p>
{% endif %}
