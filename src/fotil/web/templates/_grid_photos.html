{% if pics %}
<div id="photo-grid" class="grid grid-cols-3 md:grid-cols-4 xl:grid-cols-6 gap-3">
  {% for pic in pics %}
  <figure class="photo-card relative aspect-square overflow-hidden rounded-xl bg-[var(--fill)] cursor-pointer"
          data-pic-path="{{ pic.rel }}">
    <img class="w-full h-full object-cover" loading="lazy" decoding="async" alt="{{ pic.name }}"
         src="/image?library={{ library | urlencode }}&path={{ pic.rel | urlencode }}&size=thumb"
         onerror="fotilPicError(this)">
    <figcaption class="absolute inset-x-0 bottom-0 px-1.5 py-1 text-[11px] text-white/90 truncate bg-gradient-to-t from-black/60 to-transparent">{{ pic.name }}</figcaption>
    <span class="pick-badge absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-[var(--danger)] text-white text-sm items-center justify-center shadow">✓</span>
  </figure>
  {% endfor %}
</div>
{% if has_more %}
<div class="mt-5 text-center">
  <button id="load-more" class="btn"
          hx-get="/grid?library={{ library | urlencode }}&dir={{ dir | urlencode }}&offset={{ offset + page_size }}"
          hx-target="this" hx-swap="outerHTML">
    加载更多 (剩余 {{ remaining }})
  </button>
</div>
{% endif %}
{% elif offset == 0 %}
<p class="text-[var(--secondary)]">此目录没有照片。</p>
{% endif %}
