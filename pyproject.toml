[project]
name = "fotil"
version = "0.1.0"
description = "Camera photo & video processing utilities"
authors = [
    {name = "Chen Yufei", email = "cyfdecyf@gmail.com"},
]
dependencies = [
    "typer>=0.24.1",
    "msgspec>=0.20.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
fotil = "fotil.__main__:app"

[dependency-groups]
test = [
    "pytest>=8.1.1",
]
dev = [
    "ipython>=8.25.0",
    "ruff>=0.4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["src/fotil/static/*.jpg"]

